name: Build Morphe patches

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: patches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional read:packages token if the repository token cannot access Morphe's registry.
      GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
      GITHUB_ACTOR: ${{ secrets.MORPHE_PACKAGES_USER || github.actor }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Configure build defaults
        run: |
          cp gradle.properties.example gradle.properties
          chmod +x gradlew
      - name: Build patch bundle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace 2>&1 | tee build-patches.log
      - name: Check bundle exists
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(patches/build/libs/*.mpp)
          if (( ${#bundles[@]} == 0 )); then
            echo '::error::Build did not produce a Morphe .mpp bundle'
            exit 1
          fi
          sha256sum "${bundles[@]}" > patches/build/libs/SHA256SUMS.txt
      - name: Upload Morphe bundle
        uses: actions/upload-artifact@v4
        with:
          name: music-local-morphe-${{ github.sha }}
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-local-build-log-${{ github.run_id }}
          path: build-patches.log
          if-no-files-found: ignore
